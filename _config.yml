# About Section
about_title: About Me
about_profile_image: images/sebastian-ohmsen.jpg
about_content: > # this will include new lines to allow paragraphs
  Hi, my name is Sebastian and I am a freelance software engineer and consultant. I have 20+ years of experience in creating digital products that focus on a good user experience.


  I love to use <b>requirement analysis</b>, modern <b>architecture patterns</b> and <b>design principles</b> to create a good software architecture that allows me to implement a <b>modular</b> and <b>maintainable</b> solution. 

  <p class="quote">To go beyond is as wrong as to fall short. - <i>Confucius</i></p>

  My goal is to always write well-structured code that is robust and error tolerant. Technics like <b>clean code</b>, and <b>test-driven development</b> are the base of my daily work.


  I have worked with a wide range of program languages and frameworks. The things that I currently use on a daily bases and that I have the most experience with are: <mark>C#</mark>, <mark>Javascript</mark> and <mark>HTML&CSS</mark>, <mark>.Net Razor pages</mark>, <mark>.Net Blazor</mark>, <mark>.Net MVC</mark>, <mark>xUnit</mark>,<mark>NSubstitute</mark>, <mark>FluentAssertions</mark>, <mark>Vite</mark>, <mark>Webpack</mark>, <mark>Mocha</mark>, <mark>Chai</mark>, <mark>Sinon.JS</mark>, and <mark>SASS</mark>.

