  - title: Education # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Hamburg University of Applied Sciences
        caption: 2008 - 2011
        sub_title: MSc Computer Science - Distributed Systems
        description: | 
          During my time as a student in the Master's program, I mainly focused on the different facets of human-machine interaction.
          
          As one of the members of the Ambient Intelligence Institute at the Hamburg University of Applied Sciences, I was involved in the realization of the Living Place Hamburg, one of the first smart home laboratories in Europe. 

          In addition to developing various projects in the lab, I have experienced different perspectives and approaches to technology in various projects with artists, textile technicians and fashion designers.

          One of the highlights of these collaborations was the development of wearable electronic components for interactive clothing by Merrit Ohmsen.

      - layout: left
        title: Hamburg University of Applied Sciences
        caption: 2002 - 2008
        sub_title: BSc Computer Science for Technical Systems
        description: |
          During my degree at Hamburg University of Applied Sciences I learn skills such as developing software in teams or the basics of project management, in addition basics of software architecture, basic knowledge of circuit technology and hardware-related programming. 

          In particular, this included reading and processing a wide variety of sensors. This quickly showed me the challenges of interacting with computers beyond keyboard and mouse interaction. 

  - title: When I'm Not Programming
    layout: text
    content: | 
      When I'm not developing software, I like to spend my time working with wood to build furniture or small utility items. 

      As a father of two children, I also enjoy spending time outdoors with them, whether it's being active in nature, at the beach or discovering new cities and areas. 

      The rest of the time you can find me working on the family bikes or simply relaxing with a good book.

